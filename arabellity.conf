# ============================================================================
# arabellity terminal configuration
# Location: ~/.config/arabellity/arabellity.conf (or ./arabellity.conf)
# ============================================================================

# ----------------------------------------------------------------------------
# Window layout & geometry
# ----------------------------------------------------------------------------

# Initial window dimensions in pixels
initial_window_width  = 800
initial_window_height = 500

# Inner padding between window border and character grid (in pixels).
# Use window_padding_width to set both axes at once, or padding_x / padding_y
# to configure horizontal and vertical padding independently.
window_padding_width = 8
padding_x            = 8
padding_y            = 8

# ----------------------------------------------------------------------------
# Background opacity & blur
# ----------------------------------------------------------------------------

# Background opacity from 0.0 (fully transparent) to 1.0 (fully opaque).
# Values below 1.0 (for example, 0.85) enable ARGB8888 alpha transparency,
# allowing your Wayland compositor (Hyprland, Sway, KWin) to blur the
# background behind the terminal while keeping text 100% opaque and sharp.
background_opacity = 1.0

# Enable or disable alpha channel transparency / blur (1 = enabled, 0 = disabled)
background_blur = 1

# ----------------------------------------------------------------------------
# Mouse & keyboard behavior
# ----------------------------------------------------------------------------

# Number of lines scrolled per mouse wheel notch
scroll_lines = 3

# Keyboard auto-repeat timing:
# repeat_delay - delay in milliseconds before key repeat starts
# repeat_rate  - repeat rate in characters per second
repeat_delay = 280
repeat_rate  = 35

# ----------------------------------------------------------------------------
# Color theme (hex #RRGGBB)
# ----------------------------------------------------------------------------

background           = #000000
foreground           = #c9d1d9
cursor               = #39ff14
selection_background = #264f78
selection_foreground = #ffffff

# ----------------------------------------------------------------------------
# 16-color ANSI palette (color0 .. color15)
# ----------------------------------------------------------------------------

# Normal colors (0 - 7)
color0  = #000000
color1  = #cd0000
color2  = #00cd00
color3  = #cdcd00
color4  = #0000ee
color5  = #cd00cd
color6  = #00cdcd
color7  = #e5e5e5

# Bright colors (8 - 15)
color8  = #7f7f7f
color9  = #ff0000
color10 = #00ff00
color11 = #ffff00
color12 = #5c5cff
color13 = #ff00ff
color14 = #00ffff
color15 = #ffffff
